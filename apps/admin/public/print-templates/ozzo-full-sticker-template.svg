<?xml version="1.0" encoding="UTF-8"?>
<!--
  OZZO Safety ID: full sticker template (4.5 x 1 in, 114.3 x 25.4 mm). 1 unit = 0.01 in.
  Upload at 4.5 : 1: SVG viewBox "0 0 450 100", or PNG 2700 x 600 px (minimum 1350 x 300 px).

  ONLY THE LEFT 2.2 in (x 0-220) IS VISIBLE. The white Safety ID / PIN / QR column (x 220-335)
  and the removable cover (x 335-450) are always printed over the rest by the system, cutting
  through anything placed there. Put your whole design inside the visible area, or use the
  emergency panel template instead (recommended).

  Before exporting: delete the "GUIDES_DELETE_BEFORE_EXPORT" group, convert text to outlines,
  and export with presentation attributes (no <style> sheets).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="4.5in" height="1in" viewBox="0 0 450 100">
  <g id="ARTWORK">
    <rect width="220" height="100" fill="#E8E8E8"/>
  </g>
  <g id="GUIDES_DELETE_BEFORE_EXPORT">
    <rect x="7.874" y="7.874" width="204.252" height="84.252" fill="none" stroke="#34A853" stroke-width="0.6" stroke-dasharray="3 2"/>
    <text x="110" y="50" font-family="Helvetica, Arial, sans-serif" font-size="7" text-anchor="middle" fill="#5F6368">VISIBLE ARTWORK AREA 2.2 x 1 in</text>
    <rect x="220" y="0" width="115" height="100" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="0.6"/>
    <text x="277.5" y="47" font-family="Helvetica, Arial, sans-serif" font-size="6" text-anchor="middle" fill="#9AA0A6">SAFETY ID + PIN + QR</text>
    <text x="277.5" y="56" font-family="Helvetica, Arial, sans-serif" font-size="4.5" text-anchor="middle" fill="#9AA0A6">(system - always printed over)</text>
    <rect x="335" y="0" width="115" height="100" fill="#FFF3B0" stroke="#9AA0A6" stroke-width="0.6"/>
    <text x="392.5" y="47" font-family="Helvetica, Arial, sans-serif" font-size="6" text-anchor="middle" fill="#9AA0A6">REMOVABLE COVER</text>
    <text x="392.5" y="56" font-family="Helvetica, Arial, sans-serif" font-size="4.5" text-anchor="middle" fill="#9AA0A6">(system - always printed over)</text>
  </g>
</svg>
