<?xml version="1.0" encoding="UTF-8"?>
<!--
  OZZO Safety ID: emergency panel artwork template (recommended).
  Size: exactly 2.2 x 1 in (55.88 x 25.4 mm). 1 unit = 0.01 in. Upload at this aspect (2.2 : 1):
  SVG with viewBox "0 0 220 100", or PNG 1320 x 600 px (600 DPI; minimum 660 x 300 px).

  - Fill the whole panel edge to edge. Do NOT add bleed: the print engine extends your edges
    automatically for the own-printer + cutter sheet.
  - Keep text and logos inside the green safe area (2 mm from every edge).
  - The Safety ID, PIN, QR code and yellow cover are added by the system to the RIGHT of this
    panel. Nothing you put here can overlap them.
  - Before exporting: delete the "GUIDES_DELETE_BEFORE_EXPORT" group, convert text to outlines,
    and export with presentation attributes (no <style> sheets).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="2.2in" height="1in" viewBox="0 0 220 100">
  <g id="ARTWORK">
    <rect width="220" height="100" fill="#E8E8E8"/>
  </g>
  <g id="GUIDES_DELETE_BEFORE_EXPORT" fill="none">
    <rect x="7.874" y="7.874" width="204.252" height="84.252" stroke="#34A853" stroke-width="0.6" stroke-dasharray="3 2"/>
    <text x="110" y="47" font-family="Helvetica, Arial, sans-serif" font-size="7" text-anchor="middle" fill="#5F6368">EMERGENCY PANEL 2.2 x 1 in - fill edge to edge</text>
    <text x="110" y="58" font-family="Helvetica, Arial, sans-serif" font-size="5" text-anchor="middle" fill="#34A853">keep text / logos inside the green safe area</text>
    <text x="216" y="50" font-family="Helvetica, Arial, sans-serif" font-size="4" text-anchor="end" fill="#5F6368">Safety ID + QR start here &#8594;</text>
  </g>
</svg>
