# Common server settings for the three Ozzo vhosts (TLS, real IP, limits).
# Cloudflare Origin CA certificate (SSL mode Full (strict)); files are root-only.
ssl_certificate     /etc/helmet-platform/tls/origin.crt;
ssl_certificate_key /etc/helmet-platform/tls/origin.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:ozzo_ssl:10m;
ssl_session_timeout 1d;

# Real client IP: CF-Connecting-IP is honoured ONLY when the TCP peer is a Cloudflare range.
# Refreshed by scripts/update-cloudflare-ips-aapanel.sh.
include /etc/helmet-platform/nginx-cloudflare/realip.conf;

server_tokens off;
client_max_body_size 12m;
client_body_timeout 30s;
client_header_timeout 15s;
send_timeout 30s;

gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_proxied any;
gzip_vary on;
gzip_types application/json application/javascript text/css text/plain image/svg+xml;

# Plain HTTP (only reachable directly; Cloudflare uses HTTPS with Full (strict)).
if ($scheme = http) { return 301 https://$host$request_uri; }
