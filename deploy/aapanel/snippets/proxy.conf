# Upstream request headers for the Ozzo API (included inside location blocks).
# X-Forwarded-For is OVERWRITTEN with the verified client address (never appended to what the
# client sent); CF-Connecting-IP is stripped. The API trusts only loopback (TRUST_PROXY=loopback).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Request-Id $request_id;
proxy_set_header CF-Connecting-IP "";
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $ozzo_connection_upgrade;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 120s;
# aaPanel's global proxy.conf enables proxy_cache and retries on 404/500/503: never for this API.
proxy_cache off;
proxy_next_upstream error timeout;
proxy_intercept_errors off;
proxy_buffering off;
