# Ozzo Helmets: customer portal + public QR pages (/e/<token>, /verify/<token>).
# Installed as /www/server/panel/vhost/nginx/ozzo-portal.conf. Static build served from
# /srv/helmet-platform/www/portal (symlink swapped atomically by scripts/pm2-deploy.sh).
server {
  listen 80;
  listen 443 ssl http2;
  server_name ozzohelmets.cloud;
  include /opt/ozzohelmets/deploy/aapanel/snippets/server-common.conf;
  root /srv/helmet-platform/www/portal;
  autoindex off;
  charset utf-8;
  access_log /www/wwwlogs/ozzo-portal.access.log ozzo_json;
  error_log  /www/wwwlogs/ozzo-portal.error.log warn;
  limit_conn ozzo_conn 100;

  location /api/v1/internal/ { return 404; }
  location /api/ {
    limit_req zone=ozzo_api burst=200 nodelay;
    include /opt/ozzohelmets/deploy/aapanel/snippets/proxy.conf;
    proxy_pass http://ozzo_api;
  }

  location /assets/ {
    include /opt/ozzohelmets/deploy/aapanel/snippets/headers.conf;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Emergency page (/e/<token>): server-rendered by the API as ONE response (~3 KB gzipped,
  # stylesheet inlined, works without JavaScript) — fast on the weakest mobile connection. The API
  # sets the page's strict hash-based CSP. Short timeouts: if the API is down or slow, fall back
  # within seconds to the static client page (call button + retry), never a gateway error.
  location ~ ^/e/([0-9A-Za-z_-]{1,64})/?$ {
    limit_req zone=ozzo_pages burst=300 nodelay;
    include /opt/ozzohelmets/deploy/aapanel/snippets/headers.conf;
    proxy_hide_header X-Content-Type-Options;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 8s;
    proxy_cache off;
    proxy_next_upstream error timeout;
    proxy_intercept_errors on;
    error_page 502 504 = @emergency_fallback;
    proxy_pass http://ozzo_api/api/v1/public/emergency/$1/page;
  }

  location @emergency_fallback {
    include /opt/ozzohelmets/deploy/aapanel/snippets/headers.conf;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    try_files /emergency.html =503;
  }

  # Verification pages (and malformed /e/ paths): lightweight client entry, very strict CSP. Never
  # challenged or login-throttled; the page limit below is a coarse flood guard with a large burst.
  location ~ ^/(e|verify)/ {
    limit_req zone=ozzo_pages burst=300 nodelay;
    include /opt/ozzohelmets/deploy/aapanel/snippets/headers.conf;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache";
    try_files /emergency.html /index.html;
  }

  location / {
    limit_req zone=ozzo_pages burst=300 nodelay;
    include /opt/ozzohelmets/deploy/aapanel/snippets/headers.conf;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  location ~ /\. { deny all; }
}
