# Ozzo Helmets: admin console. Installed as /www/server/panel/vhost/nginx/ozzo-admin.conf.
# Static build served from /srv/helmet-platform/www/admin (symlink swapped by pm2-deploy.sh).
server {
  listen 80;
  listen 443 ssl http2;
  server_name admin.ozzohelmets.cloud;
  include /opt/ozzohelmets/deploy/aapanel/snippets/server-common.conf;
  root /srv/helmet-platform/www/admin;
  autoindex off;
  charset utf-8;
  access_log /www/wwwlogs/ozzo-admin.access.log ozzo_json;
  error_log  /www/wwwlogs/ozzo-admin.error.log warn;
  limit_conn ozzo_conn 50;

  location /api/v1/internal/ { return 404; }
  location /api/ {
    limit_req zone=ozzo_api burst=100 nodelay;
    include /opt/ozzohelmets/deploy/aapanel/snippets/proxy.conf;
    proxy_pass http://ozzo_api;
  }

  # Admin loads Inter from Google Fonts.
  location /assets/ {
    include /opt/ozzohelmets/deploy/aapanel/snippets/headers.conf;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    limit_req zone=ozzo_pages burst=200 nodelay;
    include /opt/ozzohelmets/deploy/aapanel/snippets/headers.conf;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  location ~ /\. { deny all; }
}
