# Ozzo Helmets: http-context definitions for aaPanel nginx (PM2 deployment, no Docker).
# Installed as /www/server/panel/vhost/nginx/0.ozzo-http.conf (aaPanel includes vhost/*.conf
# inside http{}). Every name is prefixed "ozzo_" so nothing collides with other sites.
# See docs/PM2-DEPLOYMENT.md.

# Access logs: no client IP, no query strings, QR tokens masked (same policy as the Docker edge).
map $uri $ozzo_log_uri {
  ~^(?<p>/e/|/verify/|/api/v1/public/emergency/|/api/v1/public/verify/)[A-Za-z0-9_-]+(?<rest>.*)$ $p:token$rest;
  default $uri;
}
log_format ozzo_json escape=json '{"time":"$time_iso8601","host":"$host","method":"$request_method",'
  '"uri":"$ozzo_log_uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
  '"urt":"$upstream_response_time","req_id":"$request_id","cf_ray":"$http_cf_ray"}';

# Coarse flood protection per verified client IP (real IP from Cloudflare only, see realip.conf).
# Generous bursts: a crash scene or a CGNAT network must never be locked out of /e/ pages.
limit_req_zone $binary_remote_addr zone=ozzo_api:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ozzo_pages:20m rate=60r/s;
limit_conn_zone $binary_remote_addr zone=ozzo_conn:20m;

map $http_upgrade $ozzo_connection_upgrade {
  default upgrade;
  ''      '';
}

# API process managed by PM2 (user "ozzo"), loopback only.
upstream ozzo_api {
  server 127.0.0.1:4100 max_fails=0;
  keepalive 16;
}
