# Ozzo Helmets: direct API host (optional; the SPAs use same-origin /api).
# Installed as /www/server/panel/vhost/nginx/ozzo-api.conf.
server {
  listen 80;
  listen 443 ssl http2;
  server_name api.ozzohelmets.cloud;
  include /opt/ozzohelmets/deploy/aapanel/snippets/server-common.conf;
  access_log /www/wwwlogs/ozzo-api.access.log ozzo_json;
  error_log  /www/wwwlogs/ozzo-api.error.log warn;
  limit_conn ozzo_conn 100;

  location /api/v1/internal/ { return 404; }
  location / {
    limit_req zone=ozzo_api burst=200 nodelay;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    include /opt/ozzohelmets/deploy/aapanel/snippets/proxy.conf;
    proxy_pass http://ozzo_api;
  }
}
