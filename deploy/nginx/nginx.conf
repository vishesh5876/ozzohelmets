# Edge nginx main config (replaces the image default so its "main" access log — which records
# client IPs and full URIs — is not active). The only access log is the IP-free JSON format in
# conf.d/edge.conf.
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  types_hash_max_size 2048;
  include /etc/nginx/conf.d/*.conf;
}
