# Emergency page (/e/<token>) only: identical to security-headers.conf except geolocation=(self),
# so a bystander can choose to send the rider's location to their emergency contact (read in the
# browser on tap, never sent to our server).
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
