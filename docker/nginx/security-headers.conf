# Included in every location: nginx drops inherited add_header directives when a location
# defines its own, so security headers must be repeated per location. HSTS is added by the edge
# proxy (where TLS terminates).
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
